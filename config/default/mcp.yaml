# MCP servers. Each becomes an adk toolset; its tools keep their MCP names, so
# `tools:` lists and `require_confirmation` use those. Reach a server over
# streamable HTTP (endpoint) or stdio (command). Expose one to users through
# connectors.yaml.
#
# Per server, besides how to reach it (`headers`, `thread_headers` as for
# connectors; no timeout, which would cut the session's event stream):
#   thread_args  tool → the argument the harness fills with the root thread id
#   ui           tool → the UI renderer for its calls
#   artifacts    tool → result fields {id, title, url} recorded as a url artefact
servers:
  open-slide:
    endpoint: ${OPEN_SLIDE_MCP_URL}
    thread_headers: true
    thread_args: {deck_create: thread_id, deck_list: thread_id, thread_cleanup: thread_id}
    ui: {deck_create: slides, deck_write: slides, deck_preview_url: slides}
    artifacts:
      deck_create: {id: deck_id, title: title, url: preview_url}
