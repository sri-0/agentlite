# Upstream providers. Secrets and environment-specific URLs come from the
# environment: ${VAR} is expanded in base_url and header values; *_env fields
# name the variable that holds the value. Mutual TLS, per provider:
#   tls:
#     cert_env: LITELLM_TLS_CERT                  # path to the client certificate (PEM)
#     key_env: LITELLM_TLS_KEY                    # path to its key (PEM, encrypted or not)
#     key_password_env: LITELLM_TLS_KEY_PASSWORD  # the password itself
#     ca_env: LITELLM_TLS_CA                      # path to the trusted CA bundle
# api: chat_completions (default) or responses. Reasoning deltas only stream in
# responses mode; use it on gateways that serve /v1/responses (LiteLLM does).
providers:
  - id: litellm
    name: LiteLLM
    base_url: ${LITELLM_BASE_URL}
    api_key_env: LITELLM_API_KEY
    api: responses
    discover: { endpoint: /model/info, refresh: 10m }

  - id: vllm
    name: vLLM
    base_url: ${VLLM_BASE_URL}
    api_key_env: VLLM_API_KEY
    discover: { endpoint: /models, refresh: 10m }

  # Development and testing only: without OPENROUTER_BASE_URL (production) it
  # is skipped, and a model id naming it is refused rather than sent there.
  - id: openrouter
    name: OpenRouter
    base_url: ${OPENROUTER_BASE_URL}
    api_key_env: OPENROUTER_API_KEY
    discover: { endpoint: /models, refresh: 1h }
    models:
      - id: openai/gpt-4.1-mini
        name: GPT-4.1 Mini
        owned_by: openai
        context_length: 1047576
        capabilities: [tool_calling, vision]
      - id: openai/gpt-5-mini
        name: GPT-5 Mini
        owned_by: openai
        context_length: 400000
        capabilities: [tool_calling, reasoning]
        supported_parameters: [reasoning_effort]
      - id: openai/text-embedding-3-small
        name: Text Embedding 3 Small
        type: embedding
        owned_by: openai
      - id: mistralai/voxtral-small-24b-2507   # discovered as an llm; it is for voice
        type: audio
      - id: mistralai/voxtral-small-24b-2507-stt   # Voxtral Small's speech-to-text route; vLLM serves the weights offline
        name: Voxtral Small (speech to text)
        type: transcription
      - id: qwen/qwen-image-2.1-turbo   # generates and edits; offline, vLLM-Omni serves Qwen-Image-Edit
        name: Qwen Image 2.1 Turbo
        type: image

# A model id is "<provider>/<model>": the provider's id, then the provider's
# own name for the model (openrouter/openai/gpt-4.1-mini). A request goes to
# the provider its model id names and to no other; an unknown provider or a
# model that provider does not serve is refused. Models above are declared by
# the provider's own name; each entry overrides, field by field, what
# discovery and the model cards (MODEL_CARDS_DIR) say, and may set its own
# base_url and api.
#
# A model's type decides which endpoints take it (docs/MODELS.md): llm (the
# default), embedding, decision, image, audio, rerank, transcription, speech.
# LiteLLM reports it; vLLM does not. Declare `type` here for any model that is
# not an llm, or whose reported type is wrong: an entry here overrides
# discovery. A speech model used through chat (Voxtral) is declared audio, so
# agents and the UI's model picker leave it out.
#
# Agents run on the model the request names, all the way down to sub-agents;
# this one answers when a request names none.
default_model: openrouter/openai/gpt-4.1-mini

# Context compaction for every run (adk's compaction, shown in the UI):
# before a model call whose prompt passes token_threshold of the model's
# context window, everything but the newest keep_events events is summarised.
# `interval`/`overlap` add a sliding window that summarises every `interval`
# user turns after the answer. summarizer_timeout bounds each summary (60s).
# Omit the block to disable.
compaction: { token_threshold: 0.85, keep_events: 20 }

# Long-term memory (docs/MEMORY.md): finished user-started turns are embedded
# and stored, and the agent can search them with load_memory. `preload: true`
# also searches before every model call. Omit the block to disable.
memory:
  embedding_model: openrouter/openai/text-embedding-3-small
  preload: false

# The voice prompt (internal/voice): the composer's microphone records, this
# transcription model turns it into text, and the text is sent as typed. Omit
# the block and there is no voice prompt.
voice:
  model: openrouter/mistralai/voxtral-small-24b-2507-stt
# Image generation (internal/images): the image model the generate_image tool
# uses, and the Images page's default. Every image is kept as an artifact.
# Omit the block and there is neither. A new image is made on the OpenAI
# /images/generations route. edit_model edits on /images/edits, the original
# uploaded as a form; without it an edit goes to model on /images/generations
# with the original in OpenRouter's input_references (development only).
# Offline, vLLM-Omni serves each image model on a server of its own
# (`vllm serve Qwen/Qwen-Image-2.1 --omni`), declared under the vllm provider
# with `type: image` and its own `base_url`. Qwen-Image 2.1 makes and edits:
#   model: vllm/Qwen/Qwen-Image-2.1
#   edit_model: vllm/Qwen/Qwen-Image-2.1
# Earlier Qwen-Image models edit with Qwen-Image-Edit, a second server:
#   model: vllm/Qwen/Qwen-Image
#   edit_model: vllm/Qwen/Qwen-Image-Edit-2511
images:
  model: openrouter/qwen/qwen-image-2.1-turbo
