# Upstream providers. Secrets and environment-specific URLs come from the
# environment: ${VAR} is expanded in base_url and header values; *_env fields
# name the variable that holds the value (or, for TLS, the file path).
# api: chat_completions (default) or responses. Reasoning deltas only stream in
# responses mode; use it on gateways that serve /v1/responses (LiteLLM does).
providers:
  - id: litellm
    name: LiteLLM
    base_url: ${LITELLM_BASE_URL}
    api_key_env: LITELLM_API_KEY
    api: responses
    discover: { endpoint: /model/info, refresh: 10m }

  - id: vllm
    name: vLLM
    base_url: ${VLLM_BASE_URL}
    api_key_env: VLLM_API_KEY
    discover: { endpoint: /models, refresh: 10m }

  # Development and testing only; not used in production.
  - id: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    discover: { endpoint: /models, refresh: 1h }
    models:
      - id: openai/gpt-4.1-mini
        name: GPT-4.1 Mini
        owned_by: openai
        context_length: 1047576
        capabilities: [tool_calling, vision]
      - id: openai/gpt-5-mini
        name: GPT-5 Mini
        owned_by: openai
        context_length: 400000
        capabilities: [tool_calling, reasoning]
        supported_parameters: [reasoning_effort]
      - id: openai/text-embedding-3-small
        name: Text Embedding 3 Small
        type: embedding
        owned_by: openai

# Agents run on the model the request names, all the way down to sub-agents;
# this one answers when a request names none.
default_model: openai/gpt-4.1-mini

# Context compaction for every run: a summary every `interval` user turns
# keeping `overlap` turns verbatim, and a tail-retention pass once the prompt
# exceeds `token_threshold` of the model's context window. Omit to disable.
compaction: { interval: 10, overlap: 1, token_threshold: 0.75 }

# Long-term memory (docs/MEMORY.md): finished user-started turns are embedded
# and stored, and the agent can search them with load_memory. `preload: true`
# also searches before every model call. Omit the block to disable.
memory:
  embedding_model: openai/text-embedding-3-small
  dimensions: 1536
  preload: false

# Which provider answers the pass-through routes (/v1/chat/completions,
# /v1/responses, /v1/messages, /v1/embeddings). Override per route by name.
proxy:
  provider: ${PROXY_PROVIDER}
  overrides: {}
